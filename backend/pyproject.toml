[project]
name = "blm-analytics-backend"
version = "0.1.0"
description = "NSE analytics backend for BLM Terminal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "nsepython",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "html5lib>=1.1",
    "python-dateutil>=2.9.0",
    "openai>=1.0.0",
    "mcp>=1.0.0",
    "newspaper4k>=0.9.0",
    "rapidfuzz>=3.0.0",
    "cachetools>=5.3.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "croniter>=1.3.8",
    "feedparser>=6.0.0",
    "PyPortfolioOpt>=1.5.5",
    "yfinance>=0.2.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "camoufox==0.5.6",
    "cryptography>=44.0.0,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that hit NSE upstream servers (deselect with -m 'not slow')",
]
