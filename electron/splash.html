<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLM Terminal</title>
  <style>
    body {
      background-color: #09090b; /* terminal-bg */
      color: #fbbf24; /* terminal-amber */
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    .spinner {
      border: 3px solid rgba(251, 191, 36, 0.1);
      border-left-color: #fbbf24;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .text-container {
      text-align: center;
    }
    .title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="text-container">
    <div class="title">BLM TERMINAL</div>
    <div class="subtitle">Booting background servers...</div>
  </div>
</body>
</html>
